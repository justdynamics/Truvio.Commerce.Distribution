name: validate-distribution

# Machine-enforced merge gate (v3.0 Distribution, plan §4 Phase 3). Every PR to the
# layers/ or editions/ contract must pass the structural validator. The deep clean-room
# deserialize roundtrip stays a documented operator step (run in the Foundry harness).
on:
  pull_request:
    paths:
      - 'layers/**'
      - 'editions/**'
      - 'versions/**'
      - 'contracts/cpq/**'
      - 'contracts/ledger/**'
      - 'tools/ci/**'
      - '.github/workflows/validate.yml'
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout the edition ledger revision (canonical LF)
        uses: actions/checkout@v4
        with:
          repository: dynamicweb/skills
          ref: bb68e6c4a4b8c968f5e24b0f35a8a8f6a031e02d
          path: .ledger-skills

      - name: Checkout the CPQ candidate ledger revision (canonical LF)
        uses: actions/checkout@v4
        with:
          repository: dynamicweb/skills
          ref: bb68e6c4a4b8c968f5e24b0f35a8a8f6a031e02d
          path: .ledger-skills-cpq

      # The floor rule (versions/spine.json, owner ruling redesign-floors) compares this PR's floors
      # with the base branch, so the base must be readable: a shallow checkout carries only the
      # merge commit. On a push to main the base is main itself and nothing can be raised.
      # The ledger removal rule (docs/LEDGER.md) reads editions, layer.json and the exceptions register
      # at the same base.
      - name: Fetch the base branch for the floor rule
        shell: bash
        run: git fetch --no-tags --depth=50 origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}

      - name: Validate distribution contract (schema, edition refs, base contract, version spine + floor rule, protected strings, SPEC-06, INDEX.json + gateProven + provenTree proof key + retired tombstones)
        shell: pwsh
        run: ./tools/ci/Validate-Distribution.ps1 -SpineBaseRef "origin/$env:BASE_REF" -SkillsRoot .ledger-skills -SkillsRootsByCommit @{bb68e6c4a4b8c968f5e24b0f35a8a8f6a031e02d=".ledger-skills"}
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}

      - name: Validator unit tests (tools/ci/tests, Pester)
        shell: pwsh
        run: Invoke-Pester -Path tools/ci/tests -CI
        env:
          # Cpq.Reader.Tests.ps1 reads the skills-side receipt reader from the CPQ ledger revision checked
          # out above; without this variable its five tests skip (Distribution #133).
          CPQ_SKILLS_ROOT: ${{ github.workspace }}/.ledger-skills-cpq
