name: validate-distribution

# Machine-enforced merge gate (v3.0 Distribution, plan §4 Phase 3). Every PR to the
# layers/ or editions/ contract must pass the structural validator. The deep clean-room
# deserialize roundtrip stays a documented operator step (run in the Foundry harness).
on:
  pull_request:
    paths:
      - 'layers/**'
      - 'editions/**'
      - 'versions/**'
      - 'tools/ci/**'
      - '.github/workflows/validate.yml'
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The floor rule (versions/spine.json, owner ruling redesign-floors) compares this PR's floors
      # with the base branch, so the base must be readable: a shallow checkout carries only the
      # merge commit. On a push to main the base is main itself and nothing can be raised.
      - name: Fetch the base branch for the floor rule
        shell: bash
        run: git fetch --no-tags --depth=50 origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}

      - name: Validate distribution contract (schema, edition refs, base contract, version spine + floor rule, protected strings, SPEC-06, INDEX.json + gateProven + provenTree proof key + retired tombstones)
        shell: pwsh
        run: ./tools/ci/Validate-Distribution.ps1 -SpineBaseRef "origin/$env:BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}

      - name: Validator unit tests (tools/ci/tests, Pester)
        shell: pwsh
        run: Invoke-Pester -Path tools/ci/tests -CI
