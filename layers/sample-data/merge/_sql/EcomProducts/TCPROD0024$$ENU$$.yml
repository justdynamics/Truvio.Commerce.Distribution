"ProductName": "Truvio Assortment Scope 24"
"ProductShortDescription": "Scoped to one named account, the narrowest assortment the platform allows."
"ProductLongDescription": "An assortment is the scoped slice of the catalogue a given customer, shop or user group is allowed to see and buy. This record sits in two scopes at once, which is the case that decides whether an assortment is a filter or a union. Scoping happens before rendering, so an unscoped product is absent from the list, the search index and the direct URL alike."
