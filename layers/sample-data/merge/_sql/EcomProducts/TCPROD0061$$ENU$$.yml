"ProductName": "Truvio Subscription Plan 61"
"ProductShortDescription": "A plan bought once and renewed on a schedule, so the order repeats itself."
"ProductLongDescription": "A subscription is a price structure with a period attached: the buyer agrees a recurring interval at checkout and the platform places the follow-on orders from the template it keeps. This record is the plan the recurring-order flow buys - an ordinary catalogue row with an ordinary list price, so nothing about the renewal lives in a template. Resolution is the same ordered, deterministic walk every other price takes; only the cadence is new."
