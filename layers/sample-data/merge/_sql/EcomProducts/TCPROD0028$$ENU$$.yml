"ProductShortDescription": "The deepest discount in the band, and the widest gap between list and yours."
"ProductLongDescription": "A discount ladder is a set of conditions and rewards the order engine evaluates on every cart recalculation. This record carries a quantity-triggered reward, evaluated per line rather than per order. Conditions and rewards are configured rather than written, so a campaign is authored by a merchandiser and takes effect on the next request."
