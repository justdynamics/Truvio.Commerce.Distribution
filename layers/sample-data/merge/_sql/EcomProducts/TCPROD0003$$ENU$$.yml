"ProductName": "Truvio Variant Master 03"
"ProductShortDescription": "Price steps with the tier and holds across the mode, the usual option matrix."
"ProductLongDescription": "A variant master carries the axes and the option rows that hang off them, and every combination is a product row of its own with its own price. This master shows the price stepping per tier while the mode axis leaves it untouched, which is how a real option matrix usually behaves. Open the tier and mode selectors on this page to watch the price, the number and the stock position change without leaving the record."
