"ProductName": "Truvio Assortment Scope 25"
"ProductShortDescription": "Sits in two assortments at once, which is how overlapping scopes resolve."
"ProductLongDescription": "An assortment is the scoped slice of the catalogue a given customer, shop or user group is allowed to see and buy. This record is the comparison row: same band, no scoping applied, so the effect of scoping is visible by difference. Scoping happens before rendering, so an unscoped product is absent from the list, the search index and the direct URL alike."
