"ProductName": "Truvio Variant Master 05"
"ProductShortDescription": "Widest grid in the band: every combination priced, none of them inherited."
"ProductLongDescription": "A variant master carries the axes and the option rows that hang off them, and every combination is a product row of its own with its own price. This master is the control row: same band, same fields, no variants on it, so the difference in the detail page is easy to point at. Open the tier and mode selectors on this page to watch the price, the number and the stock position change without leaving the record."
