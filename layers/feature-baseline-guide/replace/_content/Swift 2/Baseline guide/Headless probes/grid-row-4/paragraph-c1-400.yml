  "Text": |-
    <pre class="dw-paragraph-2" style="white-space:pre-wrap;word-break:break-word;overflow-x:auto;margin:0">No MCP tool writes the Delivery API — it is a read surface over what the other tools wrote.
    The MCP equivalents for the same reads: get_areas, get_pages_by_area_id,
    get_grid_rows_by_page_id, get_paragraphs_by_page_id, get_item_field_values.
    get_frontend_health is the liveness probe.</pre>
