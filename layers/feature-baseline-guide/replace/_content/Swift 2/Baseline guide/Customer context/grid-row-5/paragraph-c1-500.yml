    <pre class="dw-paragraph-2" style="white-space:pre-wrap;word-break:break-word;overflow-x:auto;margin:0">Shell, from the solution root, at the end of every phase:
        git status --porcelain "customer-context/"
    Zero output = the contract held. Any output = a bypass; investigate before declaring the phase
    complete.
    Ledger audit, same cadence: file count under Dynamicweb.Host.Suite/Controllers/ equals the
    CUSTOMISATIONS.md row count. controllerCount &gt; ledgerCount means a preflight was bypassed.</pre>
