  "Text": |-
    <pre class="dw-paragraph-2" style="white-space:pre-wrap;word-break:break-word;overflow-x:auto;margin:0">Layer: feature-rma 1.0.0 (data only) + surface-swift 1.5.1 (the page) + the platform.

    Platform (OOTB, no layer ships it): DW10 Order Management ships the RMA state machine, 7
    states — Waiting for product(s) from customer / Received / Rejected / Sent for repair /
    Received from repair / Returned to customer / Sent replacement. feature-rma seeds NO states;
    its layer.json records "Rejected" as a configRow purely to document the OOTB dependency.

    surface-swift: the page Customer center/Customer center/My returns
    (&lt;site-root&gt;/customer-center/my-returns).

    feature-rma: exactly ONE row — EcomRmas PACK-RMA-0001, RmaType 1 (Return), RmaStateId 1
    (Waiting for product(s) from customer), buyer customer number 98745621.

    ** That seeded RMA is inert on this site. ** It binds buyer 98745621 (sample-data's IMCUser)
    and, in the full swift-demo edition, the delivered order FIXT-ORDER-RMA1 from
    sample-data/_sql/catalog.sql. Neither exists here. The My returns page renders its empty state
    with the "Add new request" affordance, which is feature-rma's own behaviour probe.</pre>
