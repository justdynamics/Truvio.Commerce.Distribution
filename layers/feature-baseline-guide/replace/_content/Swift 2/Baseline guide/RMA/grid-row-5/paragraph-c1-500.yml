  "Text": |-
    <pre class="dw-paragraph-2" style="white-space:pre-wrap;word-break:break-word;overflow-x:auto;margin:0">MCP: get_rma_states returns 7 rows including "Rejected". get_all_rmas returns exactly 1 row,
    RmaId PACK-RMA-0001.
    Storefront, authenticated: GET &lt;site-root&gt;/customer-center/my-returns contains "Add new request".
    Anonymous it must not.
    After creating a return: assert it appears in the CUSTOMER CENTER list, not merely in
    get_all_rmas. The customer-center list is a three-table inner join, so a stub row satisfies
    the MCP read and renders nowhere.</pre>
