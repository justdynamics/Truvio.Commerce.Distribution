  "Text": |-
    <pre class="dw-paragraph-2" style="white-space:pre-wrap;word-break:break-word;overflow-x:auto;margin:0">get_rma_states (read the 7 platform states)
    -&gt; create_orders + complete_order (you need a delivered order to return against)
    -&gt; the FRONTEND command ?CustomerCenterCmd=addrma
    -&gt; set_rma_state -&gt; close_rma
    Reads: get_all_rmas, get_rmas_by_order_id, get_rma_by_id.

    ** create_rma is the wrong tool for a demo return. ** It produces a backend-only stub: it
    writes no order-line relation, no comment, no customer number and sends no mail, so the
    resulting RMA is unreachable from the customer center for ever. The only surface that
    produces a complete claim is the storefront command
    (dw-commerce-orders/references/rma-and-claims.md:35, :41-44). Use create_rma only when a
    backend-visible row is all you need.</pre>
  "Title": "<h2 class=\"dw-h2\">Which MCP tools brand it</h2>"
