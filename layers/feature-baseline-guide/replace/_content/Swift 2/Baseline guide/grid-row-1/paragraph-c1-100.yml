  "Text": "<p class=\"dw-paragraph-1\">One screen that says what this site is: a composed Truvio Commerce Distribution <code>swift-demo</code> without sample data, kept as a reference implementation. It names the composition, the version pins, and the rule that branding never edits a layer. Every child page is one feature area.</p><p class=\"dw-paragraph-1\"><code>&lt;site-root&gt;</code> is the segment Dynamicweb serves for the area: the culture (<code>/en-us/</code>) on a single-area host, the area URL name (<code>/swift-2/</code>) when several areas share a host; resolve it with <code>get_area_by_id</code> + one storefront GET before trusting any path.</p>"
