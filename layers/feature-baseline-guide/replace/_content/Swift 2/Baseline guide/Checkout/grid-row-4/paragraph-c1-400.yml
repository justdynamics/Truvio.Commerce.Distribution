  "Text": |-
    <pre class="dw-paragraph-2" style="white-space:pre-wrap;word-break:break-word;overflow-x:auto;margin:0">get_payments / get_shippings (read what base shipped)
    -&gt; create_payment / update_payment / toggle_payment_active / sort_payments
    -&gt; create_shipping / update_shipping / toggle_shipping_active / sort_shippings
    -&gt; create_shipping_method / save_shipping_methods (the per-country rates)
    -&gt; get_order_states / create_order_state, get_order_flows
    -&gt; save_payment_translation / save_shipping_translation (per language)
    Demo orders: create_orders -&gt; add_products -&gt; set_order_payment_method -&gt; complete_order.

    Ceilings to state rather than route around:
    - create_order_state reaches the state's name only. It has no parameter for AllowEdit,
      AllowOrder or the ten mail columns. A quote state that must permit ordering or editing is
      an admin-screen edit.
    - A scripted cart command must send a BROWSER User-Agent and FOLLOW REDIRECTS. curl and wget
      defaults fail both gates, and the failure looks like a broken cart rather than a blocked
      client.</pre>
