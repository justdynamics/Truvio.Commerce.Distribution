  "Text": |-
    <pre class="dw-paragraph-2" style="white-space:pre-wrap;word-break:break-word;overflow-x:auto;margin:0">MCP: get_user_groups returns 1325 / 1270 / 1292 and nothing else on a clean baseline.
    Storefront, BOTH auth states, and this is the assert that catches the 1.5.0 class of bug:
    sign in as a Customers-only user and GET &lt;site-root&gt;/customer-center/csr/accounts. Expected:
    denied. A 200 with account rows means an AuthenticatedFrontend grant is out-ranking the group
    deny.
    Never verify a grant as Angel / BuiltInAdmin / Administrator — those bypass every check.
    Create a Default-type user in the target group and sign in as them.
    Do not accept a case-insensitive "the page contains the persona's name" assert as proof of
    identity; that matches on an anonymous page too.
    Reading a permission row back is not proof either: PermissionsByIdentifier with an empty
    SubName returns an empty set for a page that demonstrably has seven permission rows.</pre>
  "Title": "<h2 class=\"dw-h2\">Verify</h2>"
