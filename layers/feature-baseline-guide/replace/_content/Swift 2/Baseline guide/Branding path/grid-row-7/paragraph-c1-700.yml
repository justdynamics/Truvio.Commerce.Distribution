  "Text": |-
    <table class="table" style="width:100%"><tr><td style="vertical-align:top;padding:.35rem .6rem;border-bottom:1px solid rgba(0,0,0,.1)"><strong>Skill</strong></td><td style="vertical-align:top;padding:.35rem .6rem;border-bottom:1px solid rgba(0,0,0,.1)">dw-demo-pim (dynamo: false) references/canonical-setup-order.md §1 Variant A; dw-pim-modelling (dynamo: true) references/structural-model.md; dw-pim-completeness (dynamo: true); dw-pim-workflow (dynamo: true)</td></tr><tr><td style="vertical-align:top;padding:.35rem .6rem;border-bottom:1px solid rgba(0,0,0,.1)"><strong>Input</strong></td><td style="vertical-align:top;padding:.35rem .6rem;border-bottom:1px solid rgba(0,0,0,.1)">the customer's product families, attributes and sample data files from <code>customer-context/</code></td></tr></table><p class="dw-paragraph-1">Ordered tool sequence, Variant A (Storefront-first — this site has a storefront):</p><pre class="dw-paragraph-2" style="white-space:pre-wrap;word-break:break-word;overflow-x:auto;margin:0"> 1  save_currencies, save_countries, save_languages
     2  save_shops              SHOP1 is a WHOLE-ENTITY REPLACE — read it back and send the
                                complete model, or a name-only save silently resets
                                ShopAutoBuildIndex, the image folder and patterns,
                                ShopOrderFlowId, ShopCompletionRules and ShopCreated. The save
                                response projects only id/name/usageType/topLevelProductGroups,
                                so the damage is invisible in the echo.
     4  save_units, save_manufacturers
     7  create_data_model_structure   (or create_categories -&gt; create_category_fields -&gt;
                                       save_groups -&gt; assign_categories_to_data_models)
     8  save_groups             pass shopId on SUBGROUPS too, in the same call as parentGroupId
     9  save_variant_groups, save_variant_options
    10  create_products         ignores languageId — products land on the master language
    11  assign_data_model_to_products
    12  patch_products_safe
    13  get_product_asset_categories -&gt; import_product_images_from_urls -&gt; set_product_primary_image
    14  assign_variant_groups_to_product -&gt; create_variant_combinations -&gt; get_variant_combinations
                                then fix ProductActive and ProductPrice, which
                                create_variant_combinations leaves NULL
    15  (BOM) EcomProductItems — restart the host after; the ProductItem cache is startup-scoped
    17  create_or_update_product_queries
    21  create_or_update_completeness_rules -&gt; assign_completion_rules_to_groups
    23  create_dashboards -&gt; get_available_widgets -&gt; get_widget_parameters
        -&gt; add_widgets_to_dashboards          (counts first, the grid last)
    24  build_product_index -&gt; wait_for_product_index          FINAL REBUILD, after all mutations</pre><p class="dw-paragraph-1">ID discipline: the PIM catalogue tools <strong>auto-assign entity ids and ignore ids you pass in</strong>. Capture <code>items[].id</code> from every create/save response and key every later step off the captured id. A blind re-run after a partial failure stacks duplicate, mis-IDed entities.</p><p class="dw-paragraph-1"><strong>Assert:</strong> <code>get_products</code> count equals what you authored; one <code>EcomShopGroupRelation</code> row per group; <code>verify_product_visibility</code> on one SKU reports it visible in SHOP1; <code>get_product_index_status</code> shows the primary instance Completed with a non-zero documentCount; and <code>GET &lt;site-root&gt;/shop</code> shows non-zero cards with <code>dw-error</code> 0 and rendered rows equal to the header count.</p>
