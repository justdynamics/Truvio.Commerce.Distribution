  "Text": "<table class=\"table\" style=\"width:100%\"><tr><td style=\"vertical-align:top;padding:.35rem .6rem;border-bottom:1px solid rgba(0,0,0,.1)\"><strong>Skill</strong></td><td style=\"vertical-align:top;padding:.35rem .6rem;border-bottom:1px solid rgba(0,0,0,.1)\">dw-users-permissions (dynamo: true) references/grant-mechanics.md, references/page-gating.md; dw-commerce-b2b (dynamo: true) references/account-shape.md</td></tr><tr><td style=\"vertical-align:top;padding:.35rem .6rem;border-bottom:1px solid rgba(0,0,0,.1)\"><strong>Tools</strong></td><td style=\"vertical-align:top;padding:.35rem .6rem;border-bottom:1px solid rgba(0,0,0,.1)\"><code>save_user_groups</code> -&gt; <code>get_user_groups_by_system_name</code> -&gt; <code>create_users</code> -&gt; <code>assign_users_to_group</code> -&gt; <code>save_user_addresses</code></td></tr><tr><td style=\"vertical-align:top;padding:.35rem .6rem;border-bottom:1px solid rgba(0,0,0,.1)\"><strong>Input</strong></td><td style=\"vertical-align:top;padding:.35rem .6rem;border-bottom:1px solid rgba(0,0,0,.1)\">the customer's account structure and role names, from <code>notes/wording.md</code></td></tr><tr><td style=\"vertical-align:top;padding:.35rem .6rem;border-bottom:1px solid rgba(0,0,0,.1)\"><strong>Do</strong></td><td style=\"vertical-align:top;padding:.35rem .6rem;border-bottom:1px solid rgba(0,0,0,.1)\">Build on the three base groups (Customers 1325, Account Admin 1270, CSR 1292) rather than replacing them — surface-swift's page permission blocks reference those ids by number. Author the floor of two personas. Give every contact in one account the SAME customerNumber: four features compare that string exactly, and a per-contact suffix silently disables account-wide favourites, CSR account listing and contract pricing. Passwords go to <code>notes/credentials.local.md</code>, referenced by pointer from the ledger.</td></tr><tr><td style=\"vertical-align:top;padding:.35rem .6rem;border-bottom:1px solid rgba(0,0,0,.1)\"><strong>Assert</strong></td><td style=\"vertical-align:top;padding:.35rem .6rem;border-bottom:1px solid rgba(0,0,0,.1)\"><code>get_users_by_group_id</code> returns the expected members for each group; <code>get_users_by_customer_number</code> on the account number returns every contact. Then, signed in as a Customers-only persona, <code>GET &lt;site-root&gt;/customer-center/csr/accounts</code> is denied. Never verify a grant as Angel / BuiltInAdmin / Administrator — those bypass every check; create a Default-type user in the target group. The permission model is cached in-process — recycle before believing a negative check.</td></tr></table><p class=\"dw-paragraph-1\">Two ceilings to say out loud at this step rather than route around: there is <strong>no MCP password tool</strong> (<code>create_users</code> makes a login with no usable password — setting it is an admin screen), and there is <strong>no MCP impersonation tool</strong> (Edit user &gt; Impersonation tab).</p>"
  "Title": "<h2 class=\"dw-h2\">Step 5 — Users and groups</h2>"
