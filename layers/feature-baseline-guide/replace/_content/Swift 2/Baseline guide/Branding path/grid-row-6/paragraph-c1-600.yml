  "Text": |-
    <table class="table" style="width:100%"><tr><td style="vertical-align:top;padding:.35rem .6rem;border-bottom:1px solid rgba(0,0,0,.1)"><strong>Skill</strong></td><td style="vertical-align:top;padding:.35rem .6rem;border-bottom:1px solid rgba(0,0,0,.1)">dw-swift-building (dynamo: true) SKILL.md:88-96 "Update the Area"; dw-content-localization (dynamo: true, no references/ — SKILL.md only)</td></tr><tr><td style="vertical-align:top;padding:.35rem .6rem;border-bottom:1px solid rgba(0,0,0,.1)"><strong>Tools</strong></td><td style="vertical-align:top;padding:.35rem .6rem;border-bottom:1px solid rgba(0,0,0,.1)"><code>get_areas</code> -&gt; <code>get_area_by_id</code> -&gt; <code>save_areas</code> -&gt; (host restart) -&gt; <code>find_unresolvable_item_pages</code> -&gt; <code>create_language_version</code> -&gt; <code>get_translatable_content</code> -&gt; <code>apply_translation</code></td></tr><tr><td style="vertical-align:top;padding:.35rem .6rem;border-bottom:1px solid rgba(0,0,0,.1)"><strong>Input</strong></td><td style="vertical-align:top;padding:.35rem .6rem;border-bottom:1px solid rgba(0,0,0,.1)">company name, domain, home market (country / language / currency)</td></tr><tr><td style="vertical-align:top;padding:.35rem .6rem;border-bottom:1px solid rgba(0,0,0,.1)"><strong>Do</strong></td><td style="vertical-align:top;padding:.35rem .6rem;border-bottom:1px solid rgba(0,0,0,.1)">Bind the per-environment Area values the layer deliberately did not serialize: <code>AreaFrontpage</code> (the site-root page id), <code>AreaEcomShopId</code> (SHOP1), <code>AreaEcomLanguageId</code>, <code>AreaEcomCurrencyId</code>, <code>AreaEcomCountryCode</code>, <code>AreaDomain</code>. Set <code>AreaTypographyId</code> and <code>AreaButtonStyleId</code> in the SAME <code>save_areas</code> call — an area with those empty renders the whole site as unstyled 16px serif, because Swift's heading and body scale is driven by the area's typography CSS variables. On this Distribution the correct ids are <code>default</code> / <code>default</code>, not the <code>fonts</code> / <code>buttons</code> that dw-swift-page-blocks gotcha 16 names.</td></tr><tr><td style="vertical-align:top;padding:.35rem .6rem;border-bottom:1px solid rgba(0,0,0,.1)"><strong>Assert</strong></td><td style="vertical-align:top;padding:.35rem .6rem;border-bottom:1px solid rgba(0,0,0,.1)"><code>get_area_by_id</code> echoes the bound values, and after a host restart <code>GET &lt;site-root&gt;/</code> resolves to the frontpage rather than 404. Gate after ANY area save: fetch <code>/</code> and require both <code>&lt;header data-swift-page-header=...&gt;</code> and <code>&lt;footer data-swift-page-footer=...&gt;</code> to be present.</td></tr></table><p class="dw-paragraph-1">Never create a new area in the branding flow. Repurpose area 3.</p><p class="dw-paragraph-1">If a second language is in scope, the ordered sub-flow is (<code>dw-content-localization/SKILL.md:27-91</code>):</p><pre class="dw-paragraph-2" style="white-space:pre-wrap;word-break:break-word;overflow-x:auto;margin:0">get_areas / get_master_areas          resolve the website the user means
    find_unresolvable_item_pages(areaId)  create_language_version FAILS on these — get the list
                                          first and hand it to the user; do not guess a fix
    create_language_version(sourceAreaId, culture, name)
    loop:  get_translatable_content(areaId, skip, take: 20)  -&gt;  apply_translation(units)
           WHILE HasMore is true, call again with skip = NextSkip</pre><p class="dw-paragraph-1">Stopping while <code>HasMore</code> is true leaves the rest of the page — typically the accordion at the bottom — in the source language, which is exactly the defect an un-looped call ships. Read per-page/field errors as you go and re-apply only the failures; do not halt on an individual field error. Capture every mirror's <code>PageMenuText</code> before a bulk change and diff after: a <code>reorder_pages</code> or a <code>save_pages</code> re-parent de-translates mirror labels silently, and <code>set_page_menu</code> cannot repair it — the repair is <code>set_page_item_fields {pageId: &lt;mirrorId&gt;, fields: {Title: "&lt;translated label&gt;"}}</code>.</p>
  "Title": "<h2 class=\"dw-h2\">Step 3 — Areas and languages</h2>"
