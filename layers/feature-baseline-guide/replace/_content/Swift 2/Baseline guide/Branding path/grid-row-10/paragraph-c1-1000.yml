  "Text": "<table class=\"table\" style=\"width:100%\"><tr><td style=\"vertical-align:top;padding:.35rem .6rem;border-bottom:1px solid rgba(0,0,0,.1)\"><strong>Skill</strong></td><td style=\"vertical-align:top;padding:.35rem .6rem;border-bottom:1px solid rgba(0,0,0,.1)\">dw-commerce-orders (dynamo: true) references/checkout-configuration.md, references/order-states-and-quotes.md</td></tr><tr><td style=\"vertical-align:top;padding:.35rem .6rem;border-bottom:1px solid rgba(0,0,0,.1)\"><strong>Tools</strong></td><td style=\"vertical-align:top;padding:.35rem .6rem;border-bottom:1px solid rgba(0,0,0,.1)\"><code>get_payments</code> / <code>get_shippings</code> -&gt; <code>toggle_payment_active</code> / <code>toggle_shipping_active</code> -&gt; <code>update_payment</code> / <code>update_shipping</code> -&gt; <code>sort_payments</code> / <code>sort_shippings</code> -&gt; <code>create_shipping_method</code> -&gt; <code>save_payment_translation</code> / <code>save_shipping_translation</code></td></tr><tr><td style=\"vertical-align:top;padding:.35rem .6rem;border-bottom:1px solid rgba(0,0,0,.1)\"><strong>Input</strong></td><td style=\"vertical-align:top;padding:.35rem .6rem;border-bottom:1px solid rgba(0,0,0,.1)\">the customer's payment terms (on-account vs card), delivery model, and any custom checkout field</td></tr><tr><td style=\"vertical-align:top;padding:.35rem .6rem;border-bottom:1px solid rgba(0,0,0,.1)\"><strong>Do</strong></td><td style=\"vertical-align:top;padding:.35rem .6rem;border-bottom:1px solid rgba(0,0,0,.1)\">Deactivate the stock Danish-named rows the base ships (Faktura, Kreditkort, Firmalevering, Hjemmelevering) unless the customer is Danish. Keep PAY2 Invoice active if subscriptions are in the storyline — it is the IRecurring method. A custom checkout field is an admin-screen operation: <code>create_order_field</code> errors on every call on this platform line.</td></tr><tr><td style=\"vertical-align:top;padding:.35rem .6rem;border-bottom:1px solid rgba(0,0,0,.1)\"><strong>Assert</strong></td><td style=\"vertical-align:top;padding:.35rem .6rem;border-bottom:1px solid rgba(0,0,0,.1)\"><code>GET &lt;site-root&gt;/cart/</code> is 200 and carries the line you added. Then drive the cart <strong>through the storefront's own checkout control</strong> — click it, follow redirects — and assert on the page the flow actually lands on: capture that URL and require 200. Do <strong>not</strong> hand-build a checkout path. The three checkout pages (<code>Checkout anonymous</code>, <code>Checkout user</code>, <code>Quote checkout user</code>) are <code>Swift-v2_Checkout</code> SERVICE pages and ship <code>Active=false</code> by design — Swift reaches them from the cart flow by id, never by a friendly URL — so <code>&lt;site-root&gt;/cart/checkout-user</code> is a 404 on a stock Swift 2.4 install and <strong>that 404 is the expected shape, not a broken cart</strong>. Drive the cart with a BROWSER User-Agent and follow redirects — curl and wget defaults fail the gate and that failure also looks like a broken cart. Whether the landing page renders payment and shipping NAMES is a separate open question (Foundry #1113) and is deliberately not asserted here.</td></tr></table>"
  "Title": "<h2 class=\"dw-h2\">Step 7 — Checkout</h2>"
