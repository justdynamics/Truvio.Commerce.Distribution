  "Text": "<table class=\"table\" style=\"width:100%\"><tr><td style=\"vertical-align:top;padding:.35rem .6rem;border-bottom:1px solid rgba(0,0,0,.1)\"><strong>Skill</strong></td><td style=\"vertical-align:top;padding:.35rem .6rem;border-bottom:1px solid rgba(0,0,0,.1)\">dw-commerce-orders (dynamo: true) references/checkout-configuration.md, references/order-states-and-quotes.md</td></tr><tr><td style=\"vertical-align:top;padding:.35rem .6rem;border-bottom:1px solid rgba(0,0,0,.1)\"><strong>Tools</strong></td><td style=\"vertical-align:top;padding:.35rem .6rem;border-bottom:1px solid rgba(0,0,0,.1)\"><code>get_payments</code> / <code>get_shippings</code> -&gt; <code>toggle_payment_active</code> / <code>toggle_shipping_active</code> -&gt; <code>update_payment</code> / <code>update_shipping</code> -&gt; <code>sort_payments</code> / <code>sort_shippings</code> -&gt; <code>create_shipping_method</code> -&gt; <code>save_payment_translation</code> / <code>save_shipping_translation</code></td></tr><tr><td style=\"vertical-align:top;padding:.35rem .6rem;border-bottom:1px solid rgba(0,0,0,.1)\"><strong>Input</strong></td><td style=\"vertical-align:top;padding:.35rem .6rem;border-bottom:1px solid rgba(0,0,0,.1)\">the customer's payment terms (on-account vs card), delivery model, and any custom checkout field</td></tr><tr><td style=\"vertical-align:top;padding:.35rem .6rem;border-bottom:1px solid rgba(0,0,0,.1)\"><strong>Do</strong></td><td style=\"vertical-align:top;padding:.35rem .6rem;border-bottom:1px solid rgba(0,0,0,.1)\">Deactivate the stock Danish-named rows the base ships (Faktura, Kreditkort, Firmalevering, Hjemmelevering) unless the customer is Danish. Keep PAY2 Invoice active if subscriptions are in the storyline — it is the IRecurring method. A custom checkout field is an admin-screen operation: <code>create_order_field</code> errors on every call on this platform line.</td></tr><tr><td style=\"vertical-align:top;padding:.35rem .6rem;border-bottom:1px solid rgba(0,0,0,.1)\"><strong>Assert</strong></td><td style=\"vertical-align:top;padding:.35rem .6rem;border-bottom:1px solid rgba(0,0,0,.1)\"><code>GET &lt;site-root&gt;/cart/</code> is 200, and a driven cart reaching <code>&lt;site-root&gt;/cart/checkout-user</code> renders at least one payment option and one shipping option. An all-inactive method list still returns 200. Drive the cart with a BROWSER User-Agent and follow redirects — curl and wget defaults fail both gates and the failure looks like a broken cart.</td></tr></table>"
  "Title": "<h2 class=\"dw-h2\">Step 7 — Checkout</h2>"
