  "Text": "<p><strong>Why can I not see a price until I sign in?</strong><br>Prices on this storefront are account prices. Signing in resolves the customer group you belong to, and any agreement held against your account number, before a figure is shown at all.</p><p><strong>Which number do I get if a quantity break and an account price both apply?</strong><br>The narrower one. A price scoped to your customer number beats a price scoped to your group, and a quantity break is applied against whichever of those resolved.</p><p><strong>The row shows no stock but still lets me order it. Is that a mistake?</strong><br>No. A row can be marked never out of stock, in which case the expected-delivery date on the page is the commitment rather than the shelf count.</p><p><strong>Do the options change the part number?</strong><br>Yes. Every combination of the selectors is a record of its own, with its own number, its own stock position and its own price, and the number updates as you choose.</p><p><strong>What is in the documents table?</strong><br>The datasheet, which restates the specification table in printable form, and the install guide. Both are attached to the record and carry the revision shown in the specification table.</p><p><strong>Where do the related products come from?</strong><br>From relations held on the record itself, in three groups: related products, accessories, and spare parts. A kit lists its members and each member points back at the kit.</p>"
