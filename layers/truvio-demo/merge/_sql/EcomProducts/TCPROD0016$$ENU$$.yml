"ProductName": "Truvio Price Matrix 16"
"ProductShortDescription": "A three-step quantity ladder: the price falls at five, at ten and at twenty-five."
"ProductLongDescription": "A price structure is the set of rows that answer one question - what does this product cost, for this customer, at this quantity, in this currency. This record carries the quantity ladder, so buying five, ten or twenty-five resolves to three different unit prices. Resolution is ordered and deterministic: the most specific row that matches the request wins, and nothing about it is hard-coded in a template."
