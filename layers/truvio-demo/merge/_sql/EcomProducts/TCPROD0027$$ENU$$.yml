"ProductName": "Truvio Discount Ladder 27"
"ProductShortDescription": "Discounted to a round figure rather than by a percentage."
"ProductLongDescription": "A discount ladder is a set of conditions and rewards the order engine evaluates on every cart recalculation. This record carries an amount-off reward, which behaves differently from a percentage once a cart has several lines. Conditions and rewards are configured rather than written, so a campaign is authored by a merchandiser and takes effect on the next request."
