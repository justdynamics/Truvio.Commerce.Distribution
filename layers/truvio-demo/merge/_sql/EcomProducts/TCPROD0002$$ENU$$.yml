"ProductName": "Truvio Variant Master 02"
"ProductShortDescription": "The row a signed-in account sees at an agreed price rather than the list one."
"ProductLongDescription": "A variant master carries the axes and the option rows that hang off them, and every combination is a product row of its own with its own price. This master is the one carrying a customer-scoped contract price, so a signed-in B2B account sees a different number on the same row. Open the tier and mode selectors on this page to watch the price, the number and the stock position change without leaving the record."
