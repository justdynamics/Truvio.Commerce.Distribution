"ProductName": "Truvio Price Matrix 18"
"ProductShortDescription": "Its first step is at ten, so small orders all pay the same."
"ProductLongDescription": "A price structure is the set of rows that answer one question - what does this product cost, for this customer, at this quantity, in this currency. This record shows a currency-scoped row, the shape a price takes when a solution sells in more than one currency. Resolution is ordered and deterministic: the most specific row that matches the request wins, and nothing about it is hard-coded in a template."
