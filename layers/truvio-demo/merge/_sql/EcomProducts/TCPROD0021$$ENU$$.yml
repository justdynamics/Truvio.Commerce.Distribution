"ProductName": "Truvio Assortment Kit 21"
"ProductShortDescription": "A configurable kit: pick one component from each slot and the price follows."
"ProductLongDescription": "An assortment is the scoped slice of the catalogue a given customer, shop or user group is allowed to see and buy. This record is a bill-of-materials parent: pick one component from the Variants band and one from the Item Types band, then add the configured kit to the cart. Scoping happens before rendering, so an unscoped product is absent from the list, the search index and the direct URL alike."
