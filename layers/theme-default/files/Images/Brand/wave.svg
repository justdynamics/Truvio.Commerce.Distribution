<?xml version="1.0" encoding="utf-8"?>
<!--
  wave.svg — the wave motif as a standalone SVG.

  One cubic path, viewBox 0 0 1440 75, closed down to the bottom edge. It carries NO fill
  attribute: the shape is used as a MASK, not as a picture. The pseudo-element that wears
  it supplies a flat background-color through the --td-wave-fill token and the mask carves
  the shape out of it, which is what lets a brand change the colour without touching this
  file and without a second asset per colour scheme.

  The CSS utility in default_custom.css (block 22) carries the same path inline as a
  data-URI, because a mask-image referencing an external file adds a request on the
  critical path for a decorative shape. This file is the readable source of truth and the
  thing to edit if the curve changes; keep the two in step, exactly as the token block in
  DefaultHeadInclude.cshtml is kept in step with the sheet.

  Do NOT add preserveAspectRatio here — the utility sets it on the mask side so the shape
  stretches to the owner's width at any viewport.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 75" width="1440" height="75" aria-hidden="true" focusable="false">
  <path d="M0,40 C240,74 480,8 720,32 C960,56 1200,14 1440,44 L1440,75 L0,75 Z"/>
</svg>
