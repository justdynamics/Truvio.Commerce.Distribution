  "Subtitle": "<p class=\"dw-paragraph-1\">One approved source for every brand and product file.</p>"
  "Text": "<p class=\"dw-paragraph\">The portal replaces shared drives and email attachments with a single library that is always current. When a product changes, its files change here first, so what you download is the version we stand behind.</p><p class=\"dw-paragraph\">Product files come straight from our product information system, which means names, numbers and descriptions match the catalogue your customers see. Brand files are maintained by the marketing team.</p><p class=\"dw-paragraph\">Access is personal. Each partner company has its own accounts, and every download is linked to the account that made it.</p>"
  "Title": "<h1 class=\"dw-h2\">About the Digital Assets Portal</h1>"
