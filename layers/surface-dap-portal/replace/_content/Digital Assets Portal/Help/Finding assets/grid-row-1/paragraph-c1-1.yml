  "Subtitle": "<p class=\"dw-paragraph-1\">Browse by product group or search across the whole library.</p>"
  "Text": "<p class=\"dw-paragraph\">Every product in the catalogue has its own asset page with photography, data sheets and manuals. Open Product Assets and choose a product group to narrow the list, then open a product to see all of its files.</p><p class=\"dw-paragraph\">The search field in the header searches product names, numbers and file descriptions at the same time. Results show the product and the files attached to it, so you can go straight to the document you need.</p><p class=\"dw-paragraph\">Filters on the list page narrow the results further by group and file type. The number next to each filter shows how many products match before you apply it.</p>"
