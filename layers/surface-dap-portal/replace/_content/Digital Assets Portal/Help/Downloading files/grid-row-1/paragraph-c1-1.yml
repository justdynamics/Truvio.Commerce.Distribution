  "Subtitle": "<p class=\"dw-paragraph-1\">Collect files in the download cart and take them in one archive.</p>"
  "Text": "<p class=\"dw-paragraph\">Add any file to the download cart with the button next to it. The cart keeps your selection while you keep browsing, and the counter in the header shows how many files it holds.</p><p class=\"dw-paragraph\">Open the cart to review your selection, remove files you no longer need, and download everything as a single archive. The confirmation page lists what the archive contains.</p><p class=\"dw-paragraph\">Files from the portal are licensed for marketing and selling our products. Keep logos unaltered, credit photography where the file description asks for it, and do not pass files on to third parties outside that purpose.</p>"
  "Title": "<h1 class=\"dw-h2\">Downloading files and usage rights</h1>"
